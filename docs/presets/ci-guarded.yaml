project:
  name: your-repo
  languages:
    - typescript
    - javascript
    - python
runtime:
  default: codex
commands:
  test: pnpm test
  typecheck: pnpm typecheck
  lint: pnpm lint
policy:
  defaultWriteMode: task_scope_only
  denyCommands:
    - git push
    - git commit
    - rm -rf *
    - npm publish
    - pnpm publish
    - yarn publish
